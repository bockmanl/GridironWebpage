services:
  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://server:3000
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ./server
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-gridiron}
      PGUSER: ${POSTGRES_USER:-gridiron}
      PGPASSWORD: ${POSTGRES_PASSWORD:-gridiron}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gridiron}
      POSTGRES_USER: ${POSTGRES_USER:-gridiron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridiron}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  client_node_modules:
  postgres_data:
